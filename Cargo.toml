[package]
name = "theseus-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = "0.36.2"
rand = "0.10.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
